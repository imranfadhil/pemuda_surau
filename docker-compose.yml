services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surau_password}
      POSTGRES_DB: ${POSTGRES_DB:-pemuda_surau}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surau} -d ${POSTGRES_DB:-pemuda_surau}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surau

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-surau}:${POSTGRES_PASSWORD:-surau_password}@db:5432/${POSTGRES_DB:-pemuda_surau}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.55}
      PRAYER_LATITUDE: ${PRAYER_LATITUDE:-2.93276}
      PRAYER_LONGITUDE: ${PRAYER_LONGITUDE:-101.8047}
      PRAYER_TIMEZONE: ${PRAYER_TIMEZONE:-Asia/Kuala_Lumpur}
      PRAYER_CALC_METHOD: ${PRAYER_CALC_METHOD:-17}
      PRAYER_WINDOW_BEFORE_MINUTES: ${PRAYER_WINDOW_BEFORE_MINUTES:-15}
      PRAYER_WINDOW_AFTER_MINUTES: ${PRAYER_WINDOW_AFTER_MINUTES:-60}
      PRAYER_WINDOW_BEFORE_MINUTES_ISYAK: ${PRAYER_WINDOW_BEFORE_MINUTES_ISYAK:-0}
      PRAYER_WINDOW_ENFORCED: ${PRAYER_WINDOW_ENFORCED:-true}
      GEOFENCE_ENABLED: ${GEOFENCE_ENABLED:-true}
      GEOFENCE_RADIUS_METERS: ${GEOFENCE_RADIUS_METERS:-150}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      OTP_CHANNEL: ${OTP_CHANNEL:-telegram}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-30}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      NOTIFY_PRAYER_LEAD_MINUTES: ${NOTIFY_PRAYER_LEAD_MINUTES:-15}
      NOTIFY_PROGRAM_LEAD_HOURS: ${NOTIFY_PROGRAM_LEAD_HOURS:-24}
      NOTIFY_RETRY_WINDOW_HOURS: ${NOTIFY_RETRY_WINDOW_HOURS:-2}
      NOTIFY_RETENTION_DAYS: ${NOTIFY_RETENTION_DAYS:-30}
      WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
      WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-mailto:admin@surau.local}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    networks:
      - surau

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    # Bound to localhost only: public access goes through the Cloudflare Tunnel.
    # Set WEB_BIND=0.0.0.0 to expose directly (not recommended).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    networks:
      - surau

    # Cloudflare Quick Tunnel — free random *.trycloudflare.com HTTPS URL.
  # No Cloudflare account or token required. The URL changes on every restart.
  quicktunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://web:80
    networks:
      - surau

  # Nightly PostgreSQL backups. Dumps to a local volume and (optionally)
  # uploads to Cloudflare R2. Disable with COMPOSE_PROFILES= (empty) if unused.
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-surau}
      PGPASSWORD: ${POSTGRES_PASSWORD:-surau_password}
      PGDATABASE: ${POSTGRES_DB:-pemuda_surau}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      # Cloudflare R2 (optional). Leave blank to keep local backups only.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    volumes:
      - backup_data:/backups
    networks:
      - surau

volumes:
  db_data:
  backup_data:

networks:
  surau:
    driver: bridge
