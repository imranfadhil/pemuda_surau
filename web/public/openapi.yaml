openapi: 3.0.3

info:
  title: Pemuda Surau Al-Abqori API
  version: 1.0.0
  description: |
    REST API for the Surau Al-Abqori youth programme: prayer attendance
    (face-verified + geofenced), Quran activity, merits, programs and the
    public dashboard.

    ## Authentication
    Most endpoints require a JWT obtained from `POST /api/auth/verify-otp`.
    Send it as `Authorization: Bearer <token>`.

    ## Authorisation
    Beyond "logged in", endpoints are gated by **capabilities** rather than raw
    roles (see `server/src/utils/roles.js`). Admins implicitly hold every
    capability. The `x-capability` extension on each operation records the
    requirement.

    ## Geofencing
    Check-in, activity recording and new registrations are only accepted within
    a radius of the surau. Coordinates are supplied by the client.

servers:
  - url: /api
    description: Same origin (proxied by Nginx / the Vite dev server)

tags:
  - name: Auth
    description: Login, OTP and the current profile
  - name: Users
    description: Profiles, face enrollment, dependents and member administration
  - name: Attendance
    description: Prayer check-in and attendance history
  - name: Activity
    description: Quran recitation/memorization and merits
  - name: Dashboard
    description: Public stats, weekly activity and leaderboards
  - name: Programs
    description: Surau programs and sign-ups
  - name: Telegram
    description: Telegram account linking (used for free OTP delivery)
  - name: Notifications
    description: In-app reminder feed, delivery preferences and Web Push subscriptions
  - name: System
    description: Health and diagnostics

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Authentication required
        code:
          type: string
          description: Optional machine-readable code (e.g. REGISTRATION_TOO_FAR).
          example: REGISTRATION_TOO_FAR
        retryAfterMinutes:
          type: integer
          description: Present on 429 responses (e.g. the Quran log cooldown).

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, nullable: true, example: '+60123456789' }
        fullName: { type: string, example: Ahmad bin Zainal }
        birthDate: { type: string, format: date, nullable: true }
        age: { type: integer, nullable: true, example: 17 }
        gender: { type: string, nullable: true, enum: [male, female] }
        address: { type: string, nullable: true }
        role: { type: string, enum: [youth, admin, parent, teacher, ajk] }
        capabilities:
          type: array
          items: { type: string }
          example: [checkIn, viewMembers]
        hasFace: { type: boolean }
        telegramLinked: { type: boolean }
        guardianId: { type: string, format: uuid, nullable: true }
        isDependent: { type: boolean }
        canSelfCheckIn: { type: boolean }
        createdAt: { type: string, format: date-time }

    Descriptor:
      type: array
      description: 128-float face descriptor produced by face-api.js in the browser.
      items: { type: number }
      minItems: 128
      maxItems: 128

    Attendance:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        prayer: { type: string, enum: [subuh, zuhur, asar, maghrib, isyak] }
        attendance_date: { type: string, format: date }
        checked_in_at: { type: string, format: date-time }
        method: { type: string, enum: [face, manual] }
        face_score: { type: number, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    PrayerWindow:
      type: object
      nullable: true
      properties:
        prayer: { type: string, enum: [subuh, zuhur, asar, maghrib, isyak] }
        adhan: { type: string, format: date-time }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    Merit:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        points: { type: integer }
        reason: { type: string, nullable: true }
        awarded_by: { type: string, format: uuid, nullable: true }
        awarded_by_name: { type: string, nullable: true }
        awarded_at: { type: string, format: date-time }

    QuranLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        kind: { type: string, enum: [recitation, memorization] }
        surah: { type: string, nullable: true }
        juz: { type: integer, nullable: true }
        pages: { type: integer, nullable: true }
        note: { type: string, nullable: true }
        logged_by: { type: string, format: uuid, nullable: true }
        logged_by_name: { type: string, nullable: true }
        logged_date: { type: string, format: date }
        logged_at: { type: string, format: date-time }

    ProgramInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000, nullable: true }
        location: { type: string, maxLength: 200, nullable: true }
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Required for a one-off program. A recurring program derives its
            times from the recurrence rule and may omit it.
        endsAt: { type: string, format: date-time, nullable: true }
        category: { type: string, maxLength: 60, nullable: true }
        isPublished: { type: boolean, default: true }
        latitude:
          type: number
          nullable: true
          description: |
            Optional venue latitude. When omitted (along with `longitude`) the
            surau's own configured location is used as the check-in geofence.
        longitude: { type: number, nullable: true }
        radiusMeters:
          type: integer
          minimum: 10
          maximum: 50000
          nullable: true
          description: Geofence radius for this program. Defaults to the surau radius.
        checkInGraceMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 30
          description: How long after the program ends check-in stays open.
        checkInEnabled:
          type: boolean
          default: true
          description: When false, members cannot self check-in; staff can still record manually.
        posterUrl:
          type: string
          nullable: true
          description: |
            Program poster as a data URL (resized in the browser) or an
            external image URL.
        links:
          type: array
          maxItems: 10
          description: Labelled links (e.g. a WhatsApp group and a registration form).
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string, maxLength: 60 }
              url: { type: string, format: uri, maxLength: 500 }
        recurrenceDays:
          type: array
          maxItems: 7
          description: Weekdays the program repeats on. Empty means a one-off program.
          items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
        recurrenceUntil:
          type: string
          format: date
          nullable: true
          description: Last date (inclusive) the recurrence applies. Null means indefinitely.
        recurrenceStartMode: { type: string, enum: [fixed, prayer], default: fixed }
        recurrenceStartTime:
          type: string
          nullable: true
          description: 'Wall-clock start (HH:MM) when `recurrenceStartMode` is `fixed`.'
        recurrenceStartPrayer:
          type: string
          enum: [subuh, zuhur, asar, maghrib, isyak]
          nullable: true
          description: Prayer the start is anchored to when `recurrenceStartMode` is `prayer`.
        recurrenceStartOffsetMinutes: { type: integer, default: 0 }
        recurrenceEndMode: { type: string, enum: [fixed, prayer], default: fixed }
        recurrenceEndTime: { type: string, nullable: true }
        recurrenceEndPrayer:
          type: string
          enum: [subuh, zuhur, asar, maghrib, isyak]
          nullable: true
        recurrenceEndOffsetMinutes: { type: integer, default: 0 }

    Program:
      type: object
      description: |
        A program as returned to the client. For a one-off program `is_open`
        reflects the check-in window (opens at `starts_at`, closes at `ends_at`
        — or three hours after the start when `ends_at` is null — plus
        `check_in_grace_minutes`). For a recurring program the window is derived
        from the current or next occurrence.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        location: { type: string, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        category: { type: string, nullable: true }
        is_published: { type: boolean }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        radius_meters: { type: integer, nullable: true }
        check_in_grace_minutes: { type: integer }
        check_in_enabled: { type: boolean }
        poster_url: { type: string, nullable: true }
        links:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              url: { type: string }
        is_recurring: { type: boolean }
        recurrence_days:
          type: array
          items: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
        recurrence_until: { type: string, format: date, nullable: true }
        recurrence_start_mode: { type: string, enum: [fixed, prayer] }
        recurrence_start_time: { type: string, nullable: true }
        recurrence_start_prayer: { type: string, nullable: true }
        recurrence_start_offset_minutes: { type: integer }
        recurrence_end_mode: { type: string, enum: [fixed, prayer] }
        recurrence_end_time: { type: string, nullable: true }
        recurrence_end_prayer: { type: string, nullable: true }
        recurrence_end_offset_minutes: { type: integer }
        recurrence_summary:
          type: string
          nullable: true
          description: 'Human-readable summary, e.g. "Every Mon, Tue, Wed".'
        created_by: { type: string, format: uuid, nullable: true }
        created_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        joined:
          type: boolean
          description: Whether the calling user has joined (or checked in to) this program.
        checked_in_at: { type: string, format: date-time, nullable: true }
        is_open: { type: boolean }
        check_in_opens_at: { type: string, format: date-time, nullable: true }
        check_in_closes_at: { type: string, format: date-time, nullable: true }
        session_date:
          type: string
          format: date
          nullable: true
          description: The current/next session date for a recurring program.
        next_start: { type: string, format: date-time, nullable: true }
        next_end: { type: string, format: date-time, nullable: true }
        join_count: { type: integer }
        checked_in_count: { type: integer }

    ProgramAttendance:
      type: object
      description: |
        One roster row. `joinedAt` records interest and `checkedInAt` records
        proven attendance, so a row with a join but no check-in is a no-show.
        For a recurring program `sessionDate` identifies the session.
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        isDependent:
          type: boolean
          description: True when the member has a guardian on record.
        guardianName: { type: string, nullable: true }
        joinedAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time, nullable: true }
        method: { type: string, enum: [face, manual] }
        faceScore: { type: number, nullable: true }
        sessionDate:
          type: string
          format: date
          nullable: true
          description: Session date for a recurring program; null for a one-off.
        verifiedByName:
          type: string
          nullable: true
          description: Staff member who recorded a manual check-in.

    Notification:
      type: object
      description: |
        One in-app reminder. The same row is the delivery log for the Telegram
        and Web Push channels, so the feed is the full history regardless of
        which channels a member uses.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [prayer, program] }
        title: { type: string, example: 'Zuhur in 15 minutes' }
        body: { type: string, nullable: true }
        link:
          type: string
          nullable: true
          description: In-app path to open on click (e.g. `/check-in`).
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    NotificationPrefs:
      type: object
      description: Per-member delivery preferences. Defaults (no row) are all true.
      properties:
        prayerReminders: { type: boolean }
        programReminders: { type: boolean }
        telegramEnabled: { type: boolean }
        pushEnabled: { type: boolean }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request payload.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required capability.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ------------------------------------------------------------------ Auth
  /auth/login-options:
    get:
      tags: [Auth]
      summary: Available login channels
      description: Public. Reports whether Telegram/SMS are configured.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  telegram:
                    type: object
                    properties:
                      available: { type: boolean }
                      botUrl: { type: string, nullable: true }
                      botUsername: { type: string, nullable: true }
                  sms:
                    type: object
                    properties:
                      available: { type: boolean }
                  adminAssisted: { type: boolean }

  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Send a login code to a phone
      description: |
        Public. Rate limited (10 requests / 10 minutes). Delivery prefers the
        user's linked Telegram chat, then SMS, then the server console.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '0123456789' }
      responses:
        '200':
          description: Code dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  channel: { type: string, enum: [telegram, sms, console] }
                  needsAdminHelp: { type: boolean }
                  telegramAvailable: { type: boolean }
                  telegramLinked: { type: boolean }
                  botUrl: { type: string }
                  devCode:
                    type: string
                    description: Only returned when NODE_ENV is not production.
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify a code and receive a JWT
      description: |
        Public. Creates the account if the phone is new — in which case the
        request must come from within the registration radius of the surau
        (default 1.5 km), so `latitude`/`longitude` are required for new users.
        Existing members may log in from anywhere.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: '123456' }
                latitude: { type: number, description: Required only for a NEW account. }
                longitude: { type: number, description: Required only for a NEW account. }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
                  isNewUser: { type: boolean }
                  needsProfile: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: |
            Deactivated account, a phone-less dependent account, or a new
            registration outside the allowed area (`code` is
            `REGISTRATION_TOO_FAR` / `REGISTRATION_LOCATION_REQUIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Users
  /users/me:
    put:
      tags: [Users]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName: { type: string }
                birthDate: { type: string, format: date, nullable: true }
                gender: { type: string, enum: [male, female], nullable: true }
                address: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/face:
    post:
      tags: [Users]
      summary: Enroll (or re-enroll) own face
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor]
              properties:
                descriptor: { $ref: '#/components/schemas/Descriptor' }
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/dependents:
    get:
      tags: [Users]
      summary: List my dependents (children)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependents:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      summary: Add a dependent
      description: Dependents have no phone and cannot log in until given one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName: { type: string }
                birthDate: { type: string, format: date, nullable: true }
                gender: { type: string, enum: [male, female], nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependent: { $ref: '#/components/schemas/User' }

  /users/me/dependents/{id}:
    put:
      tags: [Users]
      summary: Update a dependent
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName]
              properties:
                fullName: { type: string }
                birthDate: { type: string, format: date, nullable: true }
                gender: { type: string, enum: [male, female], nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependent: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Remove a dependent
      description: Cascades to their attendance, Quran logs and merits.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/dependents/{id}/face:
    post:
      tags: [Users]
      summary: Enroll a dependent's face
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor]
              properties:
                descriptor: { $ref: '#/components/schemas/Descriptor' }
      responses:
        '200': { description: Enrolled }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/dependents/{id}/phone:
    post:
      tags: [Users]
      summary: Give a dependent their own login
      description: |
        Sets a phone number on the existing dependent row so they can log in and
        check themselves in. History and the enrolled face are preserved, and
        the guardian link is kept. Guardians may do this for their own
        dependents; admins may do it for any dependent.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '0123456789' }
      responses:
        '200':
          description: Promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependent: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: That phone number is already registered to another account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/dependents/{id}/co-guardian:
    post:
      tags: [Users]
      summary: Share a dependent with a second guardian
      description: |
        Sets (or clears) a dependent's second guardian so both parents can check
        the child in — they often arrive separately. The other parent must
        already have an account; they are looked up by phone number. Only the
        primary guardian (or an admin) may change this. Send `phone: null` to
        clear the co-guardian.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  nullable: true
                  example: '0123456789'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  dependent: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [Users]
      summary: List all members
      description: Requires the `viewMembers` capability (teachers/AJK need it to pick a member).
      x-capability: viewMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/User'
                        - type: object
                          properties:
                            guardianName: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a member's role
      description: Admin only. Dependents inherit their guardian's role and cannot be changed.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [youth, admin, parent, teacher, ajk] }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/{id}/active:
    patch:
      tags: [Users]
      summary: Activate or deactivate a member
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200': { description: Updated }

  /users/{id}/login-code:
    post:
      tags: [Users]
      summary: Generate an admin-assisted login code
      description: |
        Admin only. Last resort when a member cannot receive an OTP — the code
        is returned in the response so an admin can read it out.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  code: { type: string, example: '123456' }
                  phone: { type: string }
                  fullName: { type: string }
                  expiresAt: { type: string, format: date-time }
        '400':
          description: Dependent accounts have no phone to log in with.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------ Attendance
  /attendance/current:
    get:
      tags: [Attendance]
      summary: Which prayer is open for check-in
      description: |
        Returns the currently open window (if any) and the next one, so the
        client can show a countdown. Returns 503 if prayer times cannot be
        fetched from the upstream provider.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  enforceWindow: { type: boolean }
                  windowBeforeMinutes: { type: integer }
                  windowAfterMinutes: { type: integer }
                  current: { $ref: '#/components/schemas/PrayerWindow' }
                  next: { $ref: '#/components/schemas/PrayerWindow' }
        '503':
          description: Prayer times temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Face-verified prayer check-in
      description: |
        The prayer is inferred server-side from the current window. The device
        must be within the check-in geofence (default 150 m).

        `forUserId` selects who is being checked in:

        - **omitted** — check yourself in;
        - **a dependent** — a guardian checks in their own child;
        - **any member** — staff holding the `identifyMembers` capability
          (teacher, AJK, admin) check in anyone, which is how a whole class is
          recorded quickly at the surau.

        In every case the scanned face must match the selected member, so a
        mismatch is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor, latitude, longitude]
              properties:
                descriptor: { $ref: '#/components/schemas/Descriptor' }
                latitude: { type: number }
                longitude: { type: number }
                forUserId:
                  type: string
                  format: uuid
                  description: |
                    Who to check in. Omit for yourself; a dependent id for your
                    own child; any member id when you hold `identifyMembers`.
                prayer:
                  type: string
                  description: Only honoured when window enforcement is disabled.
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendance: { $ref: '#/components/schemas/Attendance' }
                  confidence: { type: number }
        '401':
          description: Face not recognized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Outside the geofence, or the face does not match the selected member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: No prayer window is open, or the member has no face enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attendance/identify:
    post:
      tags: [Attendance]
      summary: Identify a member by face (staff)
      description: |
        Requires the `identifyMembers` capability. Returns a *suggestion* only —
        the client must confirm before anything is recorded.
      x-capability: identifyMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor, latitude, longitude]
              properties:
                descriptor: { $ref: '#/components/schemas/Descriptor' }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '200':
          description: Best match (and runner-up)
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      fullName: { type: string }
                      isDependent: { type: boolean }
                      confidence: { type: number }
                  runnerUp:
                    type: object
                    nullable: true
                    properties:
                      fullName: { type: string }
                      confidence: { type: number }
                  distanceFromSurau: { type: integer, description: Metres. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attendance/me:
    get:
      tags: [Attendance]
      summary: My attendance history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 60 }
      responses:
        '200': { description: OK }

  /attendance/me/today:
    get:
      tags: [Attendance]
      summary: My prayers today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  prayers:
                    type: array
                    items: { type: string }

  /attendance/family/today:
    get:
      tags: [Attendance]
      summary: Today's prayers for me and my dependents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        fullName: { type: string }
                        isDependent: { type: boolean }
                        hasFace: { type: boolean }
                        prayers:
                          type: array
                          items: { type: string }

  /attendance/family:
    get:
      tags: [Attendance]
      summary: Attendance history for me and my dependents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 60 }
      responses:
        '200': { description: OK }

  /attendance/manual:
    post:
      tags: [Attendance]
      summary: Manual check-in (admin)
      description: Admin only. Records attendance on a member's behalf, e.g. when face verification failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, prayer, date]
              properties:
                userId: { type: string, format: uuid }
                prayer: { type: string, enum: [subuh, zuhur, asar, maghrib, isyak] }
                date: { type: string, format: date }
      responses:
        '200': { description: Recorded }

  /attendance/date/{date}:
    get:
      tags: [Attendance]
      summary: Attendance for a date (admin)
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendance:
                    type: array
                    items: { $ref: '#/components/schemas/Attendance' }

  # -------------------------------------------------------------- Activity
  /activity/merits/me:
    get:
      tags: [Activity]
      summary: My merits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  merits:
                    type: array
                    items: { $ref: '#/components/schemas/Merit' }

  /activity/merits:
    get:
      tags: [Activity]
      summary: All merits (staff)
      x-capability: manageMerits
      responses:
        '200': { description: OK }
    post:
      tags: [Activity]
      summary: Award merits
      description: |
        Requires `manageMerits`. Must be within the geofence, and the supplied
        face descriptor must match the member being awarded.
      x-capability: manageMerits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, points, descriptor, latitude, longitude]
              properties:
                userId: { type: string, format: uuid }
                points: { type: integer, minimum: 1, maximum: 100 }
                reason: { type: string, nullable: true }
                descriptor: { $ref: '#/components/schemas/Descriptor' }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '201': { description: Awarded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /activity/merits/{id}:
    delete:
      tags: [Activity]
      summary: Revoke a merit
      x-capability: manageMerits
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Revoked }

  /activity/quran/me:
    get:
      tags: [Activity]
      summary: My Quran logs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recitation: { type: integer }
                  memorization: { type: integer }
                  logs:
                    type: array
                    items: { $ref: '#/components/schemas/QuranLog' }

  /activity/quran:
    get:
      tags: [Activity]
      summary: All Quran logs (staff)
      x-capability: manageQuran
      responses:
        '200': { description: OK }
    post:
      tags: [Activity]
      summary: Log Quran activity
      description: |
        At most one log per member per cooldown window (default 60 minutes) — a
        429 is returned with `retryAfterMinutes`.

        Members may log for themselves or a dependent; both must be at the surau
        (geofence) and are rate-limited by the cooldown.

        Teachers/admins (`logQuranOffsite`) may log for ANY member from anywhere:
        the geofence and the cooldown are both skipped, so a whole class can be
        recorded after the session. A face descriptor is optional there, but when
        supplied it must match the selected member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [recitation, memorization] }
                surah: { type: string, nullable: true }
                juz: { type: integer, minimum: 1, maximum: 30, nullable: true }
                pages: { type: integer, minimum: 1, nullable: true }
                note: { type: string, nullable: true }
                forUserId: { type: string, format: uuid, nullable: true }
                descriptor: { $ref: '#/components/schemas/Descriptor' }
                latitude:
                  type: number
                  nullable: true
                  description: Required unless the caller holds `logQuranOffsite`.
                longitude:
                  type: number
                  nullable: true
                  description: Required unless the caller holds `logQuranOffsite`.
      responses:
        '201': { description: Logged }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: 'Cooldown active (code: QURAN_COOLDOWN).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /activity/quran/{id}:
    put:
      tags: [Activity]
      summary: Edit a Quran log
      description: |
        Own, a dependent's, or any member for teachers/admins.

        Only the CONTENT is editable — `kind`, `surah`, `juz`, `pages` and
        `note`. The member the log belongs to and its date cannot be changed, so
        an edit can never move a record to another child or backdate it. Every
        edit stamps `updated_by`/`updated_at`, which the UI shows as
        "✏️ edited by …".
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [recitation, memorization] }
                surah: { type: string, nullable: true }
                juz: { type: integer, minimum: 1, maximum: 30, nullable: true }
                pages: { type: integer, minimum: 1, nullable: true }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  log: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Activity]
      summary: Delete a Quran log
      description: Own, a dependent's, or any member for teachers/admins.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Deleted }

  # ------------------------------------------------------------- Dashboard
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Overall stats
      description: Public — the dashboard is the app's landing page.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeMembers: { type: integer }
                  totalCheckIns: { type: integer }
                  totalMerits: { type: integer }
                  todayByPrayer:
                    type: object
                    additionalProperties: { type: integer }
                  quran:
                    type: object
                    properties:
                      recitation: { type: integer }
                      memorization: { type: integer }

  /dashboard/weekly:
    get:
      tags: [Dashboard]
      summary: Weekly activity (last 7 days)
      description: Public. Zero-filled per day.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        attendance: { type: integer }
                        prayers:
                          type: object
                          additionalProperties: { type: integer }
                        recitation: { type: integer }
                        memorization: { type: integer }
                        merits: { type: integer }

  /dashboard/leaderboard:
    get:
      tags: [Dashboard]
      summary: Leaderboard
      description: |
        Public. Ranks members by POINTS (Subuh 10, other prayers 5,
        each Quran activity 5, merits 1-10).

        **Youth only** — members aged 19 or over (and members with no birth
        date) are excluded, so adult/committee accounts do not skew the board.
      security: []
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [month, year, all], default: all }
        - name: category
          in: query
          schema:
            type: string
            enum: [overall, attendance, recitation, memorization, merits]
            default: overall
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        full_name: { type: string }
                        rank: { type: integer }
                        overall: { type: integer }
                        attendance: { type: integer }
                        recitation: { type: integer }
                        memorization: { type: integer }
                        merits: { type: integer }

  /dashboard/me/breakdown:
    get:
      tags: [Dashboard]
      summary: My per-prayer counts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  breakdown:
                    type: object
                    additionalProperties: { type: integer }
                  points:
                    type: object
                    additionalProperties: { type: integer }
                  totalPoints: { type: integer }

  /dashboard/me/scores:
    get:
      tags: [Dashboard]
      summary: My own scores
      description: |
        The caller's own scores in the same shape as a leaderboard row. Unlike
        the leaderboard this is NOT age-filtered, so an adult member (teacher,
        AJK, parent) still sees their own badges on the profile page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: object
                    properties:
                      attendance: { type: integer }
                      days_attended: { type: integer }
                      attendance_points: { type: integer }
                      recitation: { type: integer }
                      memorization: { type: integer }
                      merits: { type: integer }
                      overall: { type: integer }

  # -------------------------------------------------------------- Programs
  /programs:
    get:
      tags: [Programs]
      summary: List programs
      description: |
        Members see published programs only; staff holding `managePrograms` also
        see drafts. Each program carries the caller's own `joined` and
        `checked_in_at` state plus `is_open` for the check-in window.
      parameters:
        - name: includePast
          in: query
          schema: { type: boolean, default: false }
          description: Include programs that have already finished.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs:
                    type: array
                    items: { $ref: '#/components/schemas/Program' }
    post:
      tags: [Programs]
      summary: Create a program
      x-capability: managePrograms
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: '#/components/schemas/Program' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /programs/{id}:
    get:
      tags: [Programs]
      summary: Get one program
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: '#/components/schemas/Program' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Programs]
      summary: Update a program
      description: Partial update — omitted fields keep their current value.
      x-capability: managePrograms
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: '#/components/schemas/Program' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Programs]
      summary: Delete a program
      x-capability: managePrograms
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{id}/join:
    post:
      tags: [Programs]
      summary: Join a program
      description: |
        Records interest only. Joining is independent of check-in, so staff can
        tell who signed up but never turned up.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Joined }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Programs]
      summary: Leave a program
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Left }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{id}/check-in:
    post:
      tags: [Programs]
      summary: Face-verified program check-in
      description: |
        Check-in is only accepted while the program window is open. For a
        one-off program it opens at `starts_at` and closes at `ends_at` (or
        three hours after the start when `ends_at` is null) plus
        `check_in_grace_minutes`. For a recurring program the window is derived
        from the current occurrence. A program with `check_in_enabled: false`
        rejects member check-in entirely.

        The device must be inside the program's geofence — the program's own
        `latitude`/`longitude`/`radius_meters` when set, otherwise the surau's
        configured location and radius.

        `forUserId` selects who is being checked in:

        - **omitted** — check yourself in;
        - **a dependent** — a guardian checks in their own child;
        - **any member** — staff holding the `identifyMembers` capability
          (teacher, AJK, admin) check in anyone.

        In every case the scanned face must match the selected member, so a
        mismatch is rejected. A successful check-in also creates the join row if
        the member had not joined yet.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descriptor, latitude, longitude]
              properties:
                descriptor: { $ref: '#/components/schemas/Descriptor' }
                latitude: { type: number }
                longitude: { type: number }
                accuracy:
                  type: number
                  description: GPS accuracy in metres, used to explain a failed geofence check.
                forUserId:
                  type: string
                  format: uuid
                  description: |
                    Who to check in. Omit for yourself; a dependent id for your
                    own child; any member id when you hold `identifyMembers`.
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  attendance: { $ref: '#/components/schemas/ProgramAttendance' }
                  memberName: { type: string, description: Who was checked in. }
                  confidence:
                    type: number
                    description: Face match confidence, `1 - distance`. Higher is better.
                  distance: { type: number, description: Face descriptor distance. }
                  distanceFromVenue:
                    type: number
                    nullable: true
                    description: Metres from the geofence centre.
                  accuracy: { type: number, nullable: true }
                  sessionDate:
                    type: string
                    format: date
                    description: Session date for a recurring program.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The scanned face was not recognized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            Outside the geofence, outside the check-in window, check-in disabled,
            or the scanned face did not match the selected member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Check-in is closed for this program — either `check_in_enabled` is
            false, the window has not opened yet, or it has already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /programs/{id}/attendance:
    get:
      tags: [Programs]
      summary: Program roster
      description: |
        Joined members with their check-in state, ordered checked-in first.
        Rows with a `joined_at` but no `checked_in_at` are no-shows. For a
        recurring program each row carries its `sessionDate`.
      x-capability: managePrograms
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  program: { $ref: '#/components/schemas/Program' }
                  attendance:
                    type: array
                    items: { $ref: '#/components/schemas/ProgramAttendance' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{id}/attendance/manual:
    post:
      tags: [Programs]
      summary: Manual program check-in
      description: |
        Records attendance on a member's behalf, e.g. when face verification
        failed. Unlike member check-in this is not restricted to the program
        window and is not geofenced — the admin's own judgement is the proof.
      x-capability: managePrograms
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                sessionDate:
                  type: string
                  format: date
                  description: |
                    Session to record for a recurring program. Defaults to the
                    current or next occurrence.
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  attendance: { $ref: '#/components/schemas/ProgramAttendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /programs/{id}/attendance/{userId}:
    delete:
      tags: [Programs]
      summary: Undo a program check-in
      description: |
        Clears the check-in but keeps the join row, so the member returns to
        "joined, not attended" rather than being removed from the roster.
      x-capability: managePrograms
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionDate
          in: query
          required: false
          description: Session date for a recurring program.
          schema: { type: string, format: date }
      responses:
        '200': { description: Undone }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- Telegram
  /telegram/link-token:
    post:
      tags: [Telegram]
      summary: Create a Telegram link token
      description: Returns a token to open the bot with, linking the chat to this account.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string }

  /telegram/link:
    delete:
      tags: [Telegram]
      summary: Unlink Telegram
      responses:
        '200': { description: Unlinked }

  /telegram/status:
    get:
      tags: [Telegram]
      summary: Telegram integration status (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  botUsername: { type: string, nullable: true }
                  linkedUsers: { type: integer }

  # ---------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: In-app notification feed
      description: |
        Recent reminders for the caller (prayer + program), newest first, with
        the unread count. Fed by the same scheduler that sends Telegram/push
        messages, so the feed is complete even on channels the member doesn't use.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 30, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark notifications as read
      description: Without `ids`, marks ALL of the caller's notifications as read.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Done }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/prefs:
    get:
      tags: [Notifications]
      summary: Delivery preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Notifications]
      summary: Update delivery preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prayerReminders: { type: boolean }
                programReminders: { type: boolean }
                telegramEnabled: { type: boolean }
                pushEnabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/push/status:
    get:
      tags: [Notifications]
      summary: Web Push status for this server + device count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean, description: VAPID keys present }
                  publicKey: { type: string, nullable: true }
                  devices: { type: integer, description: Registered devices for this user }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/push/subscribe:
    post:
      tags: [Notifications]
      summary: Register this device's Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '200': { description: Subscribed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Web Push not configured on this server }

  /notifications/push/unsubscribe:
    post:
      tags: [Notifications]
      summary: Remove this device's push subscription
      description: Omit `endpoint` to remove ALL of the caller's subscriptions.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '200': { description: Unsubscribed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- System
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Public. Verifies database connectivity.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  time: { type: string, format: date-time }
        '503':
          description: Database unreachable.
